version: '3.8'

services:
  # -------------------------------------------------------------
  # Shared Coordination & Distributed Task Queue: Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: scheduler-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  # -------------------------------------------------------------
  # Relational Database: PostgreSQL 16 (Stateless API & Coordinator Metadata)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: scheduler-postgres
    environment:
      - POSTGRES_DB=scheduler
      - POSTGRES_USER=scheduler
      - POSTGRES_PASSWORD=scheduler_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 3s
      timeout: 2s
      retries: 5

  # -------------------------------------------------------------
  # Microservice 1: REST API Gateway & Web Dashboard (Stateless)
  # -------------------------------------------------------------
  scheduler-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    container_name: scheduler-api-service
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=scheduler
      - POSTGRES_USER=scheduler
      - POSTGRES_PASSWORD=scheduler_secret
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # Microservice 2: Active Master Coordinator (Stateless Node 1)
  # -------------------------------------------------------------
  scheduler-coordinator-1:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: coordinator
    container_name: scheduler-coordinator-primary
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=scheduler
      - POSTGRES_USER=scheduler
      - POSTGRES_PASSWORD=scheduler_secret
      - COORDINATOR_ID=coordinator-primary
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # Microservice 2b: Active Coordinator (Stateless Peer Node 2)
  # -------------------------------------------------------------
  scheduler-coordinator-2:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: coordinator
    container_name: scheduler-coordinator-standby
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=scheduler
      - POSTGRES_USER=scheduler
      - POSTGRES_PASSWORD=scheduler_secret
      - COORDINATOR_ID=coordinator-standby
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # Microservice 3: Worker Daemon Pod 1 (Stateless: No DB Volume)
  # -------------------------------------------------------------
  scheduler-worker-1:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    container_name: scheduler-worker-alpha
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_ID=worker-alpha
      - WORKER_CAPACITY=4
    depends_on:
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # Microservice 3b: Worker Daemon Pod 2 (Stateless: No DB Volume)
  # -------------------------------------------------------------
  scheduler-worker-2:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    container_name: scheduler-worker-beta
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_ID=worker-beta
      - WORKER_CAPACITY=4
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
